name: Validate and publish ReaPack index
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reapack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tools/run_tests.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: gem install reapack-index --no-document
      - run: reapack-index --check
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: gem install reapack-index --no-document
      - name: Generate index from committed versions
        run: reapack-index --no-commit --name "WXY REAPER Scripts"
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update ReaPack index"
            git push
          fi
